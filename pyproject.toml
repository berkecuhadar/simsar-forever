[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simsar-forever"
version = "0.1.0"
description = "Simsar Forever: local auction house analysis dashboard for WoW Forever"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cbor2>=5.6",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scipy>=1.13",
    "statsmodels>=0.14.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "lupa>=2.0", "pytest>=8"]

[project.scripts]
simsar-forever = "simsar.cli:main"
simsar = "simsar.cli:main"

[tool.setuptools.packages.find]
include = ["simsar*"]

[tool.setuptools.package-data]
simsar = ["data/*.yaml", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
