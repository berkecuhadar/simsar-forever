# Profession groups. Forever adds new items and recipes, so items are matched by name pattern
# (case-insensitive regular expressions) rather than by id. Products and reagents of known recipes
# join their profession's group automatically.
#
# To change a group, copy this file to groups.yaml next to config.yaml. Groups there replace the
# ones here with the same key; add `ids: [...]` to pin items by id.

groups:
  skinning:
    title: Skinning
    profession: Skinning
    role: gather
    color: "#c58a4b"
    patterns:
      - "Leather$"
      - "Leather Scraps$"
      - "(?<!Cured )\\b\\w+ Hide$"
      - "Scales?$"
      - "Pelt$"
      - "^Pristine (Hide|Leather)$"
    exclude:
      - "^Cured "
      - "Fish Scales$"
      - "Murloc Scale$"
      - "^Enchanted Leather$"

  fishing:
    title: Fishing
    profession: Fishing
    role: gather
    color: "#3b82f6"
    patterns:
      - "^Raw (?!Black Truffle)"
      - "^Oily Blackmouth$"
      - "^Firefin Snapper$"
      - "^Stonescale Eel$"
      - "^Deviate Fish$"
      - "^Lightning Eel$"
      - "^Shiny Fish Scales$"
      - "^Fish Oil$"
      - "Trunk$"
      - "Battered Chest$"
      - "Bound Chest$"
      - "Lockbox$"

  leatherworking:
    title: Leatherworking
    profession: Leatherworking
    role: craft
    color: "#a0522d"
    patterns:
      - "Armor Kit$"
      - "^Cured "
      - "Salt$"
      - "Leather Reagent Bag$"
      - "Ammo Pouch$"
      - "Quiver$"
    exclude:
      - "^Craftsman's Writ: "
      - "^(Pattern|Formula|Plans|Schematic|Recipe|Manual): "
      - "Ham Steak$"

  tailoring:
    title: Tailoring
    profession: Tailoring
    role: craft
    color: "#7b68ee"
    patterns:
      - "\\bCloth$"
      - "^Runecloth$"
      - "^Felcloth$"
      - "^Mooncloth$"
      - "Thread$"
      - "^Bolt of "
      - "Dye$"
      - "Spider's Silk$"
      - "(?<!Leather )Reagent Bag$"
      - "(Linen|Woolen|Silk|Mageweave|Runecloth) Bag$"
    exclude:
      - "^Craftsman's Writ: "
      - "^(Pattern|Formula|Plans|Schematic|Recipe|Manual): "
      - "Loincloth$"
      - "^Dirty Trogg Cloth$"
      - "^Sage's Cloth$"

  enchanting:
    title: Enchanting
    profession: Enchanting
    role: craft
    color: "#2eb8b8"
    patterns:
      - "(?<!Un'Goro )\\bDust$"
      - "Essence$"
      - "Shard$"
      - "^Nexus Crystal$"
      - "^(Copper|Silver|Golden|Truesilver|Arcanite) Rod$"
      - "^Runed \\w+ Rod$"
      - "Magic Wand$"
      - "(Wizard|Mana) Oil$"
      - "^Enchanted (Leather|Thorium Bar)$"
    exclude:
      - "^Craftsman's Writ: "
      - "^(Pattern|Formula|Plans|Schematic|Recipe|Manual): "
      - "^Blood Shard$"
      - "^Dust of Decay$"

  herbalism:
    title: Herbalism
    profession: Herbalism
    role: gather
    color: "#5cb85c"
    patterns:
      - "^(Peacebloom|Silverleaf|Earthroot|Mageroyal|Briarthorn|Stranglekelp|Bruiseweed|Wild Steelbloom)$"
      - "^(Grave Moss|Kingsblood|Liferoot|Fadeleaf|Goldthorn|Khadgar's Whisker|Wintersbite|Firebloom)$"
      - "^(Purple Lotus|Arthas' Tears|Sungrass|Blindweed|Ghost Mushroom|Gromsblood|Golden Sansam)$"
      - "^(Dreamfoil|Mountain Silversage|Plaguebloom|Icecap|Black Lotus|Swiftthistle|Wildvine|Deathweed)$"
      - "^Bloodthistle$"

  mining:
    title: Mining
    profession: Mining
    role: gather
    color: "#8a8f98"
    patterns:
      - '\bOre$'
      - "^(Rough|Coarse|Heavy|Solid|Dense) Stone$"
      - "^(Copper|Bronze|Tin|Iron|Steel|Silver|Gold|Mithril|Truesilver|Thorium|Dark Iron|Arcanite) Bar$"
      - "^(Tigerseye|Malachite|Shadowgem|Moss Agate|Lesser Moonstone|Jade|Citrine|Aquamarine|Star Ruby)$"
      - "^(Black Vitriol|Blue Sapphire|Large Opal|Huge Emerald|Azerothian Diamond|Arcane Crystal|Black Diamond)$"
      - "^Elemental (Earth|Fire|Water|Air)$"
    exclude:
      - "^Craftsman's Writ: "
      - "^(Pattern|Formula|Plans|Schematic|Recipe|Manual): "

  alchemy:
    title: Alchemy
    profession: Alchemy
    role: craft
    color: "#d9534f"
    patterns:
      - "Potion$"
      - "Elixir"
      - "^Flask of (?!Oil$)"
      - "Vial$"
      - "^(Fire|Frost|Shadow|Blackmouth|Fish) Oil$"
      - "^Oil of "
      - "^Philosopher's Stone$"
      - "^Transmute"
    exclude:
      - "^Craftsman's Writ: "
      - "^(Pattern|Formula|Plans|Schematic|Recipe|Manual): "

  blacksmithing:
    title: Blacksmithing
    profession: Blacksmithing
    role: craft
    color: "#b0b7c3"
    patterns:
      - "Sharpening Stone$"
      - "Weightstone$"
      - "Grinding Stone$"
      - "Skeleton Key$"
      - "Shield Spike$"
      - "^(Copper|Bronze|Iron|Steel|Mithril|Thorium|Truesilver|Runed Copper|Silvered Bronze|Green Iron|Golden Scale|Heavy Mithril|Imperial Plate|Ornate Mithril) "
    exclude:
      - "^Craftsman's Writ: "
      - "^(Pattern|Formula|Plans|Schematic|Recipe|Manual): "
      - " (Ore|Bar|Rod|Tube|Bolts|Trout|Modulator|Grenade|Bomb|Strut|Shells|Shot|Casing|Widget|Framework)$"
      - "Gyro"

  engineering:
    title: Engineering
    profession: Engineering
    role: craft
    color: "#f0ad4e"
    patterns:
      - "Blasting Powder$"
      - "Dynamite$"
      - "Bomb$"
      - "Grenade$"
      - "Bolts$"
      - "Tube$"
      - "Gizmo$"
      - "Power Core$"
      - "Modulator$"
      - "Goggles$"
      - "Scope$"
      - "(Shot|Shells|Slug|Ammo)$"
      - "Target Dummy$"
      - "Mechanical (Squirrel|Dragonling|Yeti)$"
      - "^Gyro"
      - "^Iron Strut$"
    exclude:
      - "^Craftsman's Writ: "
      - "^(Pattern|Formula|Plans|Schematic|Recipe|Manual): "
      - "Ammo Pouch$"

  cooking:
    title: Cooking
    profession: Cooking
    role: craft
    color: "#e67e22"
    patterns:
      - "Meat$"
      - "Flank$"
      - "Ribs$"
      - "Claw$"
      - "^(Small|Large|Giant|Raptor|Tender Wolf)? ?Egg$"
      - "Spices$"
      - "^(Cooked|Smoked|Grilled|Roast|Roasted|Boiled|Baked|Fried|Charred|Crispy|Spiced|Savory|Curiously|Hot|Mystery) "
      - "Stew$"
      - "^Herb Baked Egg$"
      - "Delight$"
      - "Steak$"
      - "^Sagefish Delight$"
      - "^Brilliant Smallfish$"
      - "^(Longjaw Mud Snapper|Rainbow Fin Albacore|Rockscale Cod|Bristle Whisker Catfish|Mithril Head Trout|Slitherskin Mackerel)$"
    exclude:
      - "^Craftsman's Writ: "
      - "^(Pattern|Formula|Plans|Schematic|Recipe|Manual): "

  first_aid:
    title: First Aid
    profession: First Aid
    role: craft
    color: "#e6e6e6"
    patterns:
      - "Bandage$"
      - "Anti-Venom$"
    exclude:
      - "^Craftsman's Writ: "
      - "^(Pattern|Formula|Plans|Schematic|Recipe|Manual): "

  recipes:
    title: Recipes
    profession: Recipes
    role: recipe
    color: "#d4a017"
    patterns:
      - "^(Pattern|Formula|Plans|Schematic|Recipe|Manual): "
